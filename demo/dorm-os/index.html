 *  IPHONE FRAME — adapted from huashu-design ios_frame.jsx (393×852).
 *  Standard: Dynamic Island 124×36 top:12, status bar height 54, home indicator bottom 34.
 * =======================================================================*/
function IosFrame({ children, time = "9:41", battery = 87, darkMode = false }) {
  const textColor = darkMode ? "#fff" : "#000";
  const W = 393, H = 852;
  return (
    <div style={{
      display: "inline-block", padding: 12, background: "#1a1a1a",
      borderRadius: 60, position: "relative",
      boxShadow: "0 0 0 2px #2a2a2a, 0 30px 80px rgba(0,0,0,0.25), 0 12px 28px rgba(0,0,0,0.18)",
    }}>
      <div style={{
        position: "relative", borderRadius: 48, overflow: "hidden",
        background: darkMode ? "#000" : "#fff", width: W, height: H,
      }}>
        {/* status bar */}
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, height: 54,
          display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "0 32px", fontSize: 16, fontWeight: 600,
          fontFamily: '-apple-system, "SF Pro Text", sans-serif',
          color: textColor, zIndex: 20, pointerEvents: "none",
        }}>
          <span>{time}</span>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 2, height: 12 }}>
              {[4, 6, 9, 11].map((h, i) => (
                <div key={i} style={{ width: 3, height: h, background: "currentColor", borderRadius: 1 }} />
              ))}
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={{ width: 26, height: 12, border: "1.5px solid currentColor",
                          borderRadius: 3, padding: 1, position: "relative", opacity: 0.85 }}>
              <div style={{ width: `${battery}%`, height: "100%", background: "currentColor", borderRadius: 1 }} />
              <div style={{ position: "absolute", top: 3, right: -3, width: 2, height: 6,
                            background: "currentColor", borderRadius: "0 1px 1px 0" }} />
            </div>
          </div>
        </div>
        {/* dynamic island */}
        <div style={{
          position: "absolute", top: 12, left: "50%", transform: "translateX(-50%)",
          width: 124, height: 36, background: "#000", borderRadius: 999, zIndex: 30,
        }} />

        <div style={{ position: "absolute", top: 54, left: 0, right: 0, bottom: 0, overflow: "hidden" }}>
          {children}
        </div>
        {/* home indicator */}
        <div style={{

          background: darkMode ? "rgba(255,255,255,0.55)" : "rgba(0,0,0,0.35)",

  );
}

/* Phrase neutralizer — small dictionary so the demo is honest about the
 * mechanism (front-end mapping, not LLM). */
const NUDGE_DICT = {
  alarm: "Please turn off alarms quickly in the morning.",
  鬧鐘: "Please turn off alarms quickly in the morning.",
  noise: "Please keep general noise low during quiet hours.",
  keyboard: "Please keep keyboard noise low during quiet hours.",
  鍵盤: "Please keep keyboard noise low during quiet hours.",
  game: "Please keep game audio at a respectful level after 22:00.",
  smell: "Please consider airing out the room when something has a strong smell.",
  trash: "Please take out the trash on your scheduled day.",
  desk: "Please tidy your desk area when shared space is impacted.",
  light: "Please dim or turn off the main light after midnight.",
  visitor: "Please give roommates a heads-up before bringing a visitor over.",
};
function neutralize(input) {
  if (!input || !input.trim()) return "";
  const lower = input.toLowerCase();
  for (const k of Object.keys(NUDGE_DICT)) {
    if (lower.includes(k)) return NUDGE_DICT[k];
  }
  return "Please be considerate of roommates regarding: " + input.trim();
}

function EventsScreen({ go, joined, setJoined, toast }) {
  const [detail, setDetail] = useState(null);
  const list = MOCK.events;

  const join = (id) => {
    setJoined(prev => {
      const next = new Set(prev);
      if (next.has(id)) { next.delete(id); toast("Left event"); }
      else              { next.add(id);    toast("You're in. We'll remind you 30 min before."); }
      return next;
    });
  };

  return (
    <>
      <PageHeader title="Events" subtitle="This week"
        onHome={() => go("home")} />
      <div style={{ padding: "0 18px" }}>
        {list.map(ev => {
          const isJoined = joined.has(ev.id);
          const count = ev.joined + (isJoined ? 1 : 0);
          return (
            <div key={ev.id} style={{
              background: "white", border: "1px solid #E2E8F0", borderRadius: 14,
              marginBottom: 10, overflow: "hidden",
            }}>
              <button onClick={() => setDetail(ev)} style={{
                width: "100%", padding: 14, background: "transparent", border: "none",
                textAlign: "left", cursor: "pointer", display: "flex", gap: 12,
              }}>
                <div style={{
                  width: 44, height: 44, borderRadius: 12, flexShrink: 0,
                  background: "#3B82F61A", color: "#3B82F6",
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}>
                  <Icon d={ICONS[ev.icon]} size={20} stroke={2} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, color: "#0F172A" }}>{ev.title}</div>
                    <div style={{ fontSize: 11, color: "#3B82F6", fontWeight: 600,
                                  letterSpacing: 0.5 }}>{ev.day} · {ev.time.split(" – ")[0]}</div>
                  </div>
                  <div style={{ fontSize: 12, color: "#64748B", marginTop: 4 }}>
                    {count} going
                  </div>
                </div>
              </button>
              <button onClick={() => join(ev.id)} style={{
                width: "100%", padding: "10px 0", border: "none", cursor: "pointer",
                borderTop: "1px solid #F1F5F9",
                background: isJoined ? "#16A34A" : "transparent",
                color:      isJoined ? "white"  : "#16A34A",
                fontSize: 13, fontWeight: 600,

            </div>

        })}

        <div style={{ height: 90 }} />
      </div>

      {detail && (
        <Sheet onClose={() => setDetail(null)} title={detail.title}>
          <div style={{ fontSize: 13, color: "#64748B", marginBottom: 4 }}>{detail.subtitle}</div>
          <div style={{
            display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, margin: "16px 0",
          }}>
            <Stat label="When" value={`${detail.day} · ${detail.time}`} />
            <Stat label="Going" value={`${detail.joined}/${detail.cap}`} />
            <Stat label="Host" value={detail.host} />
            <Stat label="Cost" value="Free" />

          <p style={{ fontSize: 13, color: "#334155", lineHeight: 1.55, marginBottom: 14 }}>

function MoveScreen({ go, moveState, setMoveState, toast }) {
  const [tab, setTab] = useState("in");
  const list = tab === "in" ? MOCK.moveIn : MOCK.moveOut;
  const stateKey = tab === "in" ? "moveIn" : "moveOut";
  const checked = moveState[stateKey] || new Set();
  const doneN = checked.size;

  const toggle = (i) => {
    const next = new Set(checked);
    if (next.has(i)) next.delete(i);
    else { next.add(i); toast("Step done"); }
    setMoveState({ ...moveState, [stateKey]: next });
  };

  return (
    <>
      <PageHeader title="Move" subtitle="Check in or check out, simply"
        onHome={() => go("home")} />
      <div style={{ padding: "0 18px" }}>
        <div style={{ display: "flex", gap: 6, padding: 4, background: "#F1F5F9",
                      borderRadius: 10, marginBottom: 14 }}>
          {[{k:"in",l:"Move-in"},{k:"out",l:"Move-out"}].map(t => (
            <button key={t.k} onClick={() => setTab(t.k)} style={{
              flex: 1, padding: "7px 0", border: "none", borderRadius: 7,
              fontSize: 12, fontWeight: 600, cursor: "pointer",
              background: tab === t.k ? "white" : "transparent",
              color:      tab === t.k ? "#0F172A" : "#64748B",
              boxShadow:  tab === t.k ? "0 1px 3px rgba(15,23,42,0.06)" : "none",
            }}>{t.l}</button>
          ))}
        </div>

        <div style={{
          background: "white", border: "1px solid #E2E8F0", borderRadius: 18,
          padding: 16, marginBottom: 14,
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <div>
              <div style={{ fontSize: 11, letterSpacing: 0.18 * 12, textTransform: "uppercase",
                            color: "#94A3B8", fontWeight: 700 }}>
                {tab === "in" ? "Move-in checklist" : "Move-out checklist"}
              </div>
              <div style={{ fontSize: 28, fontWeight: 600, color: "#0F172A",
                            fontFamily: 'inherit',
                            fontFeatureSettings: "'tnum'", marginTop: 2 }}>
                {doneN}<span style={{ color: "#94A3B8" }}>/{list.length}</span>
              </div>
            </div>
            <div style={{ width: 100, height: 6, background: "#F1F5F9", borderRadius: 99,
                          overflow: "hidden", alignSelf: "center" }}>
              <div style={{ width: `${(doneN / list.length) * 100}%`, height: "100%",
                            background: "#16A34A", transition: "width 0.3s" }} />
            </div>
          </div>
        </div>

        <div style={{ background: "white", border: "1px solid #E2E8F0", borderRadius: 14,
                      overflow: "hidden", marginBottom: 14 }}>
          {list.map((step, i) => {
            const done = checked.has(i);
            return (

function Stat({ label, value }) {
  return (
    <div style={{
      padding: 12, borderRadius: 10, background: "#F8FAFC",
      border: "1px solid #E2E8F0",
    }}>
      <div style={{ fontSize: 10, letterSpacing: 0.16 * 12, textTransform: "uppercase",
                    color: "#94A3B8", fontWeight: 700 }}>{label}</div>
      <div style={{ fontSize: 13, fontWeight: 600, color: "#0F172A", marginTop: 4 }}>{value}</div>
    </div>
  );
}

function TabBar({ screen, go }) {
  const tabs = [
    { k: "dorm",    l: "Dorm",    icon: "dorm" },
    { k: "events",  l: "Events",  icon: "events" },
    { k: "reports", l: "Reports", icon: "reports" },
    { k: "groups",  l: "Groups",  icon: "groups" },
    { k: "move",    l: "Move",    icon: "move" },
  ];
  return (
    <div style={{
      position: "absolute", bottom: 0, left: 0, right: 0,
      paddingBottom: 22, paddingTop: 8,
      background: "rgba(255, 255, 255, 0.92)",
      backdropFilter: "blur(20px)",
      WebkitBackdropFilter: "blur(20px)",
      borderTop: "1px solid #E2E8F0",
      display: "flex", justifyContent: "space-around",
      zIndex: 40,
    }}>
      {tabs.map(t => {
        const active = screen === t.k;
        return (
          <button key={t.k} onClick={() => go(t.k)} style={{
            flex: 1, background: "transparent", border: "none", cursor: "pointer",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
            padding: "4px 0",
            color: active ? "#16A34A" : "#94A3B8",
          }}>
            <Icon d={ICONS[t.icon]} size={22} stroke={active ? 2 : 1.6} />
            <span style={{ fontSize: 10, fontWeight: 600,
                           letterSpacing: 0.2, marginTop: 1 }}>{t.l}</span>
          </button>
        );
      })}
    </div>
  );
}

/* =========================================================================
 *  APP SHELL — gestures, state, toast, screen routing.
 * =======================================================================*/
const TAB_ORDER = ["dorm", "events", "reports", "groups", "move"];

function DormOSApp() {
  const [screen, setScreen]       = useState("home");
  const [groupId, setGroupId]     = useState("g303");
  const [groupSub, setGroupSub]   = useState(null);
  const [joined, setJoined]       = useState(new Set(["e1"]));
  const [reports, setReports]     = useState(MOCK.reports);
  const [paid, setPaid]           = useState(new Set(["alex", "chris"]));
  const [choreState, setChoreState] = useState({});
  const [nudges, setNudges]       = useState(MOCK.nudgesSeed);
  const [vibe, setVibe]           = useState(MOCK.vibes);
  const [moveState, setMoveState] = useState({});
  const [toastMsg, setToastMsg]   = useState("");
  const [now, setNow]             = useState("9:41");

  // status bar clock
  useEffect(() => {
    const update = () => {
      const d = new Date();
      setNow(`${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`);
    };
    update();
    const id = setInterval(update, 30000);
    return () => clearInterval(id);
  }, []);

  // toast
  const toast = useCallback((msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(""), 2000);
  }, []);

  // helpers
  const go = useCallback((target) => {
    setGroupSub(null);
    setScreen(target);
  }, []);
  const openGroup = useCallback((gid) => {
    setGroupId(gid);
    setGroupSub(null);
    setScreen("group-room");
  }, []);
  const addNudge = (n) => setNudges(prev => [n, ...prev]);

  // -- swipe / wheel / keyboard gesture handling --
  // Horizontal swipe between tab screens; if inside a group sub-view or detail, swipe is disabled.
  const swipeLockRef = useRef(false);
  const swipeBetweenTabs = useCallback((dir) => {
    if (swipeLockRef.current) return;
    if (groupSub) return;
    const tabIdx = TAB_ORDER.indexOf(screen);
    if (tabIdx === -1) {
      if (screen === "home") {
        if (dir > 0) go("dorm");
        return;
      }
      return;
    }
    const next = tabIdx + dir;
    if (next < 0) { go("home"); return; }
    if (next >= TAB_ORDER.length) return;
    swipeLockRef.current = true;
    setTimeout(() => { swipeLockRef.current = false; }, 280);
    go(TAB_ORDER[next]);
  }, [screen, groupSub, go]);

  // keyboard
  useEffect(() => {
    const onKey = (e) => {
      // ignore typing
      if (e.target.matches("input, textarea")) return;
      if (e.key === "ArrowLeft")  { e.preventDefault(); swipeBetweenTabs(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); swipeBetweenTabs(+1); }
      if (e.key === "h" || e.key === "H") { e.preventDefault(); go("home"); }
      if (e.key === "Escape" && groupSub) { setGroupSub(null); }
      if (e.key === "r" || e.key === "R") {
        // soft reset — bring everything back to seed
        setScreen("home"); setGroupSub(null);
        setJoined(new Set(["e1"]));
        setReports(MOCK.reports);
        setPaid(new Set(["alex", "chris"]));
        setChoreState({});
        setNudges(MOCK.nudgesSeed);
        setVibe(MOCK.vibes);
        setMoveState({});
        toast("Demo reset");
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [swipeBetweenTabs, groupSub, go, toast]);

  // wheel — horizontal trackpad gestures (deltaX) translate to tab swipe
  const wheelAccum = useRef(0);
  const wheelLast  = useRef(0);
  const onWheel = (e) => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      // horizontal scroll — swap tabs
      e.preventDefault();
      const now = Date.now();
      if (now - wheelLast.current > 350) wheelAccum.current = 0;
      wheelLast.current = now;
      wheelAccum.current += e.deltaX;
      if (Math.abs(wheelAccum.current) > 60) {
        swipeBetweenTabs(wheelAccum.current > 0 ? +1 : -1);
        wheelAccum.current = 0;
      }
    }
    // vertical wheel — let it bubble to scrollable inner content
  };

  // pointer drag — mouse + touch
  const dragState = useRef({ x: 0, y: 0, active: false, decided: null });
  const onPointerDown = (e) => {
    dragState.current = { x: e.clientX, y: e.clientY, active: true, decided: null };
  };
  const onPointerMove = (e) => {
    if (!dragState.current.active) return;
    const dx = e.clientX - dragState.current.x;
    const dy = e.clientY - dragState.current.y;
    if (dragState.current.decided === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      dragState.current.decided = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
  };
  const onPointerUp = (e) => {
    if (!dragState.current.active) return;
    const dx = e.clientX - dragState.current.x;
    if (dragState.current.decided === "x" && Math.abs(dx) > 60) {
      swipeBetweenTabs(dx < 0 ? +1 : -1);
    }
    dragState.current.active = false;
  };

  // render screen
  let screenNode;
  switch (screen) {
    case "home":
      screenNode = <HomeScreen go={go} openGroup={openGroup} />; break;
    case "dorm":
      screenNode = <DormScreen go={go} />; break;
    case "events":
      screenNode = <EventsScreen go={go} joined={joined} setJoined={setJoined} toast={toast} />; break;
    case "reports":
      screenNode = <ReportsScreen go={go} reports={reports} setReports={setReports} toast={toast} />; break;
    case "groups":
      screenNode = <GroupsScreen go={go} openGroup={openGroup} />; break;
    case "group-room":
      screenNode = <GroupRoomScreen go={go} groupId={groupId}
                     sub={groupSub} setSub={setGroupSub}
                     choreState={choreState} setChoreState={setChoreState}
                     paid={paid} setPaid={setPaid}
                     nudges={nudges} addNudge={addNudge}
                     vibe={vibe} setVibe={setVibe}
                     toast={toast} />; break;
    case "move":
      screenNode = <MoveScreen go={go} moveState={moveState} setMoveState={setMoveState} toast={toast} />; break;
    default:
      screenNode = <HomeScreen go={go} openGroup={openGroup} />;
  }

  const tabActive = TAB_ORDER.includes(screen) ? screen : (screen === "group-room" ? "groups" : null);

  return (
    <div className="phone-stage">
      <IosFrame time={now} battery={87}>
        <div
          onWheel={onWheel}
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerCancel={onPointerUp}
          style={{
            position: "absolute", inset: 0, background: "#F4F1EC",
            overflow: "hidden", touchAction: "pan-y",
          }}>
          <div key={screen + (groupSub || "")}
               style={{
                 position: "absolute", inset: 0, overflowY: "auto",
                 paddingBottom: 70,
                 animation: "slideIn 0.22s ease",
               }}>
            {screenNode}
          </div>
          <TabBar screen={tabActive} go={go} />
        </div>
        {toastMsg && <div className="toast">{toastMsg}</div>}
        <style>{`
          @keyframes slideIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
        `}</style>
      </IosFrame>
    </div>
  );
}

/* =========================================================================
 *  Fit-to-viewport — keep the phone as large as it can be while always visible.
 *  Phone outer box ≈ 423 × 884 (393 + 12*2 padding + 2*2 outline border).
 * =======================================================================*/
function useFitPhone() {
  useEffect(() => {
    const PHONE_W = 423, PHONE_H = 884;
    const fit = () => {
      const el = document.querySelector(".phone-stage");
      if (!el) return;
      const vw = window.innerWidth, vh = window.innerHeight;
      const margin = 24;
      const s = Math.min(1.4, (vw - margin) / PHONE_W, (vh - margin) / PHONE_H);
      el.style.transform = `scale(${s.toFixed(3)})`;
    };
    fit();
    window.addEventListener("resize", fit);
    return () => window.removeEventListener("resize", fit);
  }, []);
}

function Root() {
  useFitPhone();
  return <DormOSApp />;
}

/* mount */
ReactDOM.createRoot(document.getElementById("app")).render(<Root />);
</script>
</body>
</html>
